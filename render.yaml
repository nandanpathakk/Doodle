# Render blueprint for the collaboration relay.
#
# Only the relay goes here. The app itself is a Next.js build and lives on
# Vercel; the two are deployed separately and only ever meet in the browser.
#
# After the first deploy, set NEXT_PUBLIC_COLLAB_URL on Vercel to
# wss://<this-service>.onrender.com and redeploy the app — that value is baked
# in at build time, so restarting is not enough.
services:
  - type: web
    name: doodle-relay
    runtime: node
    plan: free
    # Rooms live in this process's memory. Two instances would mean two people
    # "in the same room" could land on different ones and never see each other,
    # so this must never be scaled out.
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm run server
    # `ws` alone answers plain HTTP with 426 Upgrade Required, which reads as
    # unhealthy and gets the service restarted in a loop. server/relay.ts serves
    # this path with a 200 instead.
    healthCheckPath: /healthz
    envVars:
      # The entry point is TypeScript, executed directly by Node's type
      # stripping, so this cannot be left to Render's default — an older one
      # fails outright with `Unknown file extension ".ts"`.
      #
      # The major only, deliberately: Render resolves the newest 24.x, so
      # security patches arrive without a commit, while a major version never
      # changes underneath us. 24 is the LTS line; the odd-numbered lines are
      # supported for about six months and are not for long-running servers.
      - key: NODE_VERSION
        value: "24"
